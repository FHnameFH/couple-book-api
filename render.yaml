services:
  - type: web
    name: couple-book-api
    runtime: go
    env: go
    buildCommand: go build -o app .
    startCommand: ./app
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: couple-book-db
          property: connectionString

databases:
  - name: couple-book-db
    plan: free
